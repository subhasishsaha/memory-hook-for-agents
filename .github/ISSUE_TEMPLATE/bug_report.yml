name: Bug Report
description: File a bug report to help improve memory-hook
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI Provider
      description: Which AI provider or agent runtime were you using?
      options:
        - All / General
        - Antigravity
        - Claude Code
        - OpenAI Codex
        - Cursor
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Run 'memory-hook install'
        2. Execute '...'
        3. Encounter error: '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, memory-hook version.
      placeholder: Windows 11 / Ubuntu 22.04 / macOS 14, Python 3.10.9, memory-hook 0.1.0
